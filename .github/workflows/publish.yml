name: Publish extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `publish` environment only admits v* tags (repo Settings →
    # Environments). Open VSX trusted publishing is registered against this
    # workflow file AND this environment, so a run on any other ref can't
    # mint a publish token. Side effect: manual runs from a branch are blocked.
    environment: publish
    # Least privilege: `contents: write` to create/attach the GitHub release;
    # `id-token: write` lets ovsx request a short-lived OIDC token for Open VSX
    # trusted publishing (no long-lived secret). Marketplace still uses a PAT.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # vsce package runs `vscode:prepublish` (tsc + esbuild), which needs the
      # devDependencies — the extension is no longer static.
      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --no-yarn --out vscode-kicad-dru.vsix

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-kicad-dru.vsix

      # Attach first: the GitHub release is the channel that always works, so a
      # store failure below must not keep it from going out.
      - name: Attach .vsix to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        # SHA-pinned (supply-chain hygiene): third-party action pinned to the
        # exact commit behind the v2 tag. A v3 line exists — bump deliberately
        # after reviewing its changelog, not implicitly via a moving tag.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: vscode-kicad-dru.vsix

      # Step-level env (least privilege) isn't visible to a step's own `if`,
      # so the secret-present check lives in the shell, where it is. Skips
      # cleanly when the PAT is absent; publishes when it's set.
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set — skipping Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath vscode-kicad-dru.vsix --pat "$VSCE_PAT"

      # Open VSX. Two modes:
      #  - OVSX_PAT set: one-time bootstrap. Open VSX requires the FIRST version
      #    of an extension to be published with a token (trusted publishing can
      #    only be registered for an extension that already exists). Creates the
      #    `cimos` namespace if missing. Delete the secret afterwards — a PAT
      #    always takes precedence over trusted publishing.
      #  - no OVSX_PAT: trusted publishing via GitHub OIDC (id-token: write),
      #    registered on open-vsx.org for Cimos/vscode-kicad-dru, publish.yml,
      #    environment `publish`. Fails loudly if no OIDC token can be minted.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx create-namespace cimos -p "$OVSX_PAT" || echo "Namespace 'cimos' already exists (or could not be created) — continuing."
            npx --yes ovsx publish vscode-kicad-dru.vsix -p "$OVSX_PAT"
          else
            npx --yes ovsx publish vscode-kicad-dru.vsix --trusted-publishing
          fi
